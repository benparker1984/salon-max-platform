name: SalonMax
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  SalonMax:
    type: application
    platform: iOS
    sources:
      - SalonMax.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.salonmax.portal
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Salon Max
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
